  try{
    await Store.set('control_parental', JSON.stringify({pin: state.pin, maxAge: state.maxAge}));
  }catch(e){ console.error('No se pudo guardar el PIN', e); }
}

function askPin(targetAge){
  const entered = prompt('Contenido bloqueado. Introduce el PIN de control parental:');
  if(entered === null) return;
  if(entered === state.pin){
    state.unlocked = true;
    if(targetAge) state.age = targetAge;
    renderAges();
    pickJoke();
    renderJoke();
  } else {
    alert('PIN incorrecto.');
  }
}

function renderLockBar(){
  const bar = document.getElementById('lock-bar');
  if(!bar) return;
  if(!state.pin){
    bar.innerHTML = `<span class="lock-txt">Sin control parental</span><button class="lock-btn" id="lock-set">🔒 Activar</button>`;
    document.getElementById('lock-set').onclick = ()=>{
      const p = prompt('Crea un PIN de 4 dígitos (solo tú debes saberlo):');
      if(!p) return;
      if(!/^\d{4}$/.test(p)){ alert('El PIN debe tener exactamente 4 dígitos.'); return; }
      const lim = prompt('Edad máxima permitida sin PIN. Escribe 4, 8, 13 o 18:', '8');
      const limN = parseInt(lim, 10);
      if(![4,8,13,18].includes(limN)){ alert('Valor no válido.'); return; }
      state.pin = p;
      state.maxAge = limN;
      state.unlocked = false;
      if(state.age > limN) state.age = limN;
      savePin();
      renderAges();
      pickJoke();
      renderJoke();
    };
  } else {
    const estado = state.unlocked ? 'desbloqueado' : 'activo';
    bar.innerHTML = `<span class="lock-txt">🔒 Control parental ${estado} · hasta ${state.maxAge===18?'18+':state.maxAge+' años'}</span><button class="lock-btn" id="lock-off">${state.unlocked ? 'Bloquear' : 'Quitar'}</button>`;
    document.getElementById('lock-off').onclick = ()=>{
      if(state.unlocked){
        state.unlocked = false;
        if(state.age > state.maxAge) state.age = state.maxAge;
        renderAges();
        pickJoke();
        renderJoke();
        return;
      }
      const entered = prompt('Introduce el PIN para desactivar el control parental:');
      if(entered === null) return;
      if(entered !== state.pin){ alert('PIN incorrecto.'); return; }
      state.pin = null;
      state.unlocked = false;
      savePin();
      renderAges();
    };
  }
}


// Almacenamiento con respaldo: usa window.storage si existe,
// si no localStorage (archivo abierto directamente), y si no, memoria.
const Store = (function(){
  const mem = {};
  const hasArtifact = (typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function');
  let localOk = false;
  try{
    localStorage.setItem('__t','1'); localStorage.removeItem('__t'); localOk = true;
  }catch(e){ localOk = false; }

  return {
    async get(key){
      if(hasArtifact){
        try{
          const r = await window.storage.get(key, false);
          if(r) return r.value;
        }catch(e){ /* sigue a los respaldos */ }
      }
      if(localOk){
        const v = localStorage.getItem(key);
        if(v !== null) return v;
      }
      return (key in mem) ? mem[key] : null;
    },
    async set(key, value){
      mem[key] = value;
      if(hasArtifact){
        try{ await window.storage.set(key, value, false); return true; }catch(e){ /* sigue */ }
      }
      if(localOk){
        try{ localStorage.setItem(key, value); return true; }catch(e){ /* sigue */ }
      }
      return true;
    }
  };
})();

let voicesReady = false;
let esVoice = null;

function loadVoices(){
  if(!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  if(vs && vs.length){
    esVoice = vs.find(v=>/^es[-_]ES/i.test(v.lang))
           || vs.find(v=>/^es/i.test(v.lang))
           || null;
    voicesReady = true;
  }
}
if('speechSynthesis' in window){
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}

function speakText(text, rate, onend, onfail){
  const u = new SpeechSynthesisUtterance(text);
  if(esVoice) u.voice = esVoice;
  u.lang = esVoice ? esVoice.lang : 'es-ES';
  u.rate = rate;
  u.pitch = 1.05;
  u.volume = 1;
  let finished = false;
  u.onend = ()=>{ finished = true; if(onend) onend(); };
  u.onerror = ()=>{ finished = true; if(onfail) onfail(); };
  speechSynthesis.speak(u);
  // Algunos navegadores se quedan en pausa: reanudar por si acaso
  setTimeout(()=>{ try{ if(speechSynthesis.paused) speechSynthesis.resume(); }catch(e){} }, 120);
  // Si no arranca nada en 1.5s, avisamos
  setTimeout(()=>{
    if(!finished && !speechSynthesis.speaking && !speechSynthesis.pending){
      if(onfail) onfail();
    }
  }, 1500);
}

function speakFailed(){
  const b = document.getElementById('speak-btn');
  if(b){
    b.classList.remove('speaking');
    b.innerHTML = '🔇 Sin voz disponible';
    setTimeout(()=>{ const x=document.getElementById('speak-btn'); if(x) x.innerHTML='🔊 Escuchar'; }, 2500);
  }
}

function speakItem(j, btn){
  if(!('speechSynthesis' in window)) return;

  // Si ya está hablando, este toque lo detiene
  if(speechSynthesis.speaking || speechSynthesis.pending){
    speechSynthesis.cancel();
    document.querySelectorAll('.speak-btn.speaking').forEach(b=>b.classList.remove('speaking'));
    return;
  }

  loadVoices();
  const u = new SpeechSynthesisUtterance(j.setup + ' ... ' + j.punch);
  if(esVoice) u.voice = esVoice;
  u.lang = esVoice ? esVoice.lang : 'es-ES';
  u.rate = 0.95;
  u.pitch = 1.05;
  u.volume = 1;

  if(btn) btn.classList.add('speaking');
  const done = ()=>{ if(btn) btn.classList.remove('speaking'); };
  u.onend = done;
  u.onerror = done;

  speechSynthesis.speak(u);
  setTimeout(()=>{ try{ if(speechSynthesis.paused) speechSynthesis.resume(); }catch(e){} }, 150);
}

function speakJoke(j){
  if(!('speechSynthesis' in window)){
    speakFailed();
    return;
  }

  // Si ya está hablando, este toque sirve para parar
  if(speechSynthesis.speaking || speechSynthesis.pending){
    speechSynthesis.cancel();
    const b = document.getElementById('speak-btn');
    if(b) b.classList.remove('speaking');
    return;
  }

  loadVoices();

  // Destapamos el remate antes de hablar, para no tener que
  // re-renderizar a mitad de la locución.
  if(!state.revealed){
    state.revealed = true;
    renderJoke();
  }

  // IMPORTANTE: hablar de forma síncrona dentro del gesto del usuario.
  // Un solo texto, con puntos suspensivos como pausa dramática.
  const texto = j.setup + ' ... ' + j.punch;
  const u = new SpeechSynthesisUtterance(texto);
  if(esVoice) u.voice = esVoice;
  u.lang = esVoice ? esVoice.lang : 'es-ES';
  u.rate = 0.95;
  u.pitch = 1.05;
  u.volume = 1;

  const btn = document.getElementById('speak-btn');
  if(btn) btn.classList.add('speaking');

  const done = ()=>{ const b = document.getElementById('speak-btn'); if(b) b.classList.remove('speaking'); };
  u.onend = done;
  u.onerror = ()=>{ done(); speakFailed(); };

  speechSynthesis.speak(u);

  // Chrome a veces arranca en pausa
  setTimeout(()=>{ try{ if(speechSynthesis.paused) speechSynthesis.resume(); }catch(e){} }, 150);

  // Si a los 2s no ha sonado nada, avisamos
  setTimeout(()=>{
    if(!speechSynthesis.speaking && !speechSynthesis.pending){
      done();
      speakFailed();
    }
  }, 2000);
}

function jokeKey(j){ return j.t + "|" + j.a + "|" + j.setup; }

function renderJoke(){
  const card = document.getElementById('joke-card');
  const favBtn = document.getElementById('fav-btn');
  if(!state.current){
    card.innerHTML = `<p class="empty-msg">No hay chistes para esta combinación todavía. Prueba otra categoría o edad.</p>`;
    favBtn.style.visibility = 'hidden';
    return;
  }
  favBtn.style.visibility = 'visible';
  const j = state.current;
  const catInfo = CATS.find(c=>c.key===j.t);
  let html = `<button class="joke-dismiss" id="dismiss-btn" title="Quitar este chiste">✕</button>`;
  const esMio = state.custom.some(c => jokeKey(c) === jokeKey(j));
  const esGuardado = state.favorites.some(f => jokeKey(f) === jokeKey(j));
  html += `<span class="joke-tag">${catInfo ? catInfo.icon+' '+catInfo.label : j.t} · ${ageBucketLabel(state.age)}</span>`;
  if(esMio) html += `<span class="joke-tag mine">✏️ Mío</span>`;
  else if(esGuardado) html += `<span class="joke-tag saved">★ Guardado</span>`;
  html += `<p class="joke-setup">${j.setup}</p>`;
  if(state.revealed){
    html += `<p class="joke-punchline">${j.punch}</p>`;
  }
  html += `<div class="card-actions">`;
  if(!state.revealed){
    html += `<button class="reveal-btn" id="reveal-btn">Ver remate</button>`;
  }
  html += `<button class="speak-btn" id="speak-btn" title="Leer en voz alta">🔊 Escuchar</button>`;
  html += `</div>`;
  card.innerHTML = html;
  const rb = document.getElementById('reveal-btn');
  if(rb){ rb.onclick = ()=>{ state.revealed = true; renderJoke(); }; }
  document.getElementById('speak-btn').onclick = ()=> speakJoke(j);
  document.getElementById('dismiss-btn').onclick = ()=>{
    const key = jokeKey(j);
    const isCustom = state.custom.some(c => jokeKey(c) === key);
    if(isCustom){
      state.custom = state.custom.filter(c => jokeKey(c) !== key);
      saveCustom();
      renderMine();
    } else {
      state.hidden.push(key);
      saveHidden();
    }
    pickJoke();
    renderJoke();
  };

  const isSaved = state.favorites.some(f => jokeKey(f) === jokeKey(j));
  favBtn.classList.toggle('saved', isSaved);
  favBtn.innerHTML = isSaved ? '★ Guardado' : '♡ Guardar';
}

function groupByCat(list){
  const groups = {};
  list.forEach(j=>{
    if(!groups[j.t]) groups[j.t] = [];
    groups[j.t].push(j);
  });
  return groups;
}

function renderJokeList(el, list, onRemove, emptyMsg, onEdit, variant){
  if(list.length === 0){
    el.innerHTML = `<p class="fav-empty">${emptyMsg}</p>`;
    return;
  }
  el.innerHTML = "";
  const groups = groupByCat(list);
  CATS.filter(c=>c.key!=='todas').forEach(c=>{
    const items = groups[c.key];
    if(!items || !items.length) return;
    items.slice().reverse().forEach(j=>{
      const item = document.createElement('div');
      item.className = 'fav-item' + (variant ? ' ' + variant : '');
      let abierto = false;

      const pinta = ()=>{
        const editBtn = onEdit ? `<button class="item-btn edit" title="Editar">✎</button>` : '';
        item.innerHTML =
          `<div class="item-head">` +
            `<span class="item-cat">${c.icon} ${c.label}</span>` +
            `<div class="item-btns">${editBtn}<button class="item-btn remove" title="Quitar">✕</button></div>` +
          `</div>` +
          `<p class="joke-setup">${j.setup}</p>` +
          (abierto ? `<p class="joke-punchline">${j.punch}</p>` : '') +
          `<div class="card-actions">` +
            (abierto ? '' : `<button class="reveal-btn item-reveal">Ver remate</button>`) +
            `<button class="speak-btn item-listen">🔊 Escuchar</button>` +
          `</div>`;

        item.querySelector('.item-btn.remove').onclick = ()=> onRemove(j);
        const ed = item.querySelector('.item-btn.edit');
        if(ed) ed.onclick = ()=> onEdit(j);
        const rv = item.querySelector('.item-reveal');
        if(rv) rv.onclick = ()=>{ abierto = true; pinta(); };
        item.querySelector('.item-listen').onclick = (ev)=>{
          abierto = true;
          pinta();
          speakItem(j, item.querySelector('.item-listen'));
        };
      };

      pinta();
      el.appendChild(item);
    });
  });
}

  editingKey = jokeKey(j);
  document.getElementById('f-setup').value = j.setup;
  document.getElementById('f-punch').value = j.punch;
  document.getElementById('f-cat').value = j.t;
  document.getElementById('f-age').value = String(j.a);

  document.getElementById('add-form').classList.add('open');

}

function resetForm(){
  editingKey = null;
  document.getElementById('f-setup').value = "";
  document.getElementById('f-punch').value = "";
  document.getElementById('f-save').textContent = 'Guardar chiste';
  document.getElementById('add-toggle-btn').textContent = '✏️ Agregar mi propio chiste';

}

const addToggleBtn = document.getElementById('add-toggle-btn');
const addForm = document.getElementById('add-form');
const formError = document.getElementById('form-error');

addToggleBtn.onclick = ()=>{
  if(addForm.classList.contains('open')){ resetForm(); return; }
  addForm.classList.add('open');
};

document.getElementById('f-cancel').onclick = ()=> resetForm();

document.getElementById('f-save').onclick = ()=>{
  const setup = document.getElementById('f-setup').value.trim();
  const punch = document.getElementById('f-punch').value.trim();
  if(!setup || !punch){
    formError.classList.add('show');
    return;
  }
  formError.classList.remove('show');
  const t = document.getElementById('f-cat').value;
  const a = parseInt(document.getElementById('f-age').value, 10);

  if(editingKey){
    const i = state.custom.findIndex(c => jokeKey(c) === editingKey);
    if(i !== -1) state.custom[i] = {t, a, setup, punch};
    // si el chiste editado era el que se muestra, refrescarlo
    if(state.current && jokeKey(state.current) === editingKey){
      state.current = {t, a, setup, punch};
      renderJoke();
    }
  } else {
    state.custom.push({t, a, setup, punch});
  }

  saveCustom();
  renderMine();
  resetForm();
};

document.getElementById('fav-btn').onclick = ()=>{

  if(already){
    state.favorites = state.favorites.filter(f => jokeKey(f) !== key);
  } else {
    state.favorites.push(state.current);
  }
  saveFavorites();
  renderFavorites();
  renderJoke();
